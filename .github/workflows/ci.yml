name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      web: ${{ steps.filter.outputs.web }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.sqlx/**'
              - 'server/**'
            web:
              - '.node-version'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'rstack.config.ts'
              - 'web/**'
            workflow:
              - '.github/workflows/**'

  web:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 根目录的 pnpm check 还会跑 cargo，这里只检查前端
      - name: Check
        run: pnpm exec rs check --type-check

      - name: Test
        run: pnpm --filter @koiro/web test

      - name: Build
        run: pnpm --filter @koiro/web build

  server:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.workflow == 'true'
    timeout-minutes: 30
    env:
      # 使用仓库里的 .sqlx 离线查询数据，编译不需要数据库
      SQLX_OFFLINE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  deploy-server:
    name: Backend Deploy
    # 服务器是 Debian 12（glibc 2.36），在 glibc 更老的 22.04（2.35）上编译才能在服务器上运行
    runs-on: ubuntu-22.04
    needs:
      - changes
      - server
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.server == 'true' || needs.changes.outputs.workflow == 'true')
    environment: production
    # 生产发布串行执行；后续提交不取消正在进行的发布。
    concurrency:
      group: koiro-production-api
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      SQLX_OFFLINE: 'true'
      KOIRO_HOST: ${{ secrets.KOIRO_HOST }}
      KOIRO_USERNAME: ${{ secrets.KOIRO_USERNAME }}
      KOIRO_WORKDIR: ${{ secrets.KOIRO_WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --locked -p koiro-server --bin koiro-server

      - name: Configure SSH
        env:
          KOIRO_SSH_KEY: ${{ secrets.KOIRO_SSH_KEY }}
          KOIRO_KNOWN_HOSTS: ${{ secrets.KOIRO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$KOIRO_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$KOIRO_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$KOIRO_WORKDIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ -n "$KOIRO_SSH_KEY" && -n "$KOIRO_KNOWN_HOSTS" ]]
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KOIRO_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KOIRO_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      # rsync 的目标固定为 staging/koiro-server，那里保存着上一次发布的二进制，
      # 块级增量因此生效。传向每次都不同的 releases/<SHA>/ 会退化成全量传输。
      - name: Upload binary to staging
        run: |
          set -euo pipefail
          rsync --ignore-times --compress --stats \
            --partial --partial-dir=.rsync-partial \
            -e "ssh -i $RUNNER_TEMP/ssh/key -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts \
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8" \
            target/release/koiro-server \
            "$KOIRO_USERNAME@$KOIRO_HOST:$KOIRO_WORKDIR/api/staging/koiro-server"

      - name: Activate release
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$KOIRO_USERNAME@$KOIRO_HOST" "$KOIRO_WORKDIR/deploy.sh api $GITHUB_SHA"

  deploy-web:
    name: Frontend Deploy
    runs-on: ubuntu-latest
    needs:
      - changes
      - web
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.web == 'true' || needs.changes.outputs.workflow == 'true')
    environment: production
    concurrency:
      group: koiro-production-web
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      KOIRO_HOST: ${{ secrets.KOIRO_HOST }}
      KOIRO_USERNAME: ${{ secrets.KOIRO_USERNAME }}
      KOIRO_WORKDIR: ${{ secrets.KOIRO_WORKDIR }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端用相对路径 /api 请求后端，产物与域名无关
      - name: Build web
        env:
          PUBLIC_SITE_NAME: ${{ vars.KOIRO_SITE_NAME }}
        run: pnpm --filter @koiro/web build

      - name: Configure SSH
        env:
          KOIRO_SSH_KEY: ${{ secrets.KOIRO_SSH_KEY }}
          KOIRO_KNOWN_HOSTS: ${{ secrets.KOIRO_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$KOIRO_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$KOIRO_USERNAME" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$KOIRO_WORKDIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ -n "$KOIRO_SSH_KEY" && -n "$KOIRO_KNOWN_HOSTS" ]]
          mkdir -m 700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$KOIRO_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KOIRO_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"

      # --delete 让上一次构建里已经不存在的产物不会在暂存目录里堆积。
      - name: Upload site to staging
        run: |
          set -euo pipefail
          rsync --recursive --times --delete --compress --stats \
            --partial --partial-dir=.rsync-partial \
            -e "ssh -i $RUNNER_TEMP/ssh/key -o BatchMode=yes -o IdentitiesOnly=yes \
                -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts \
                -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8" \
            web/dist/ \
            "$KOIRO_USERNAME@$KOIRO_HOST:$KOIRO_WORKDIR/web/staging/"

      - name: Activate release
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$KOIRO_USERNAME@$KOIRO_HOST" "$KOIRO_WORKDIR/deploy.sh web $GITHUB_SHA"

  ci:
    name: CI
    runs-on: ubuntu-latest
    needs:
      - changes
      - web
      - server
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]] ||
             [[ "${{ needs.web.result }}" != "success" && "${{ needs.web.result }}" != "skipped" ]] ||
             [[ "${{ needs.server.result }}" != "success" && "${{ needs.server.result }}" != "skipped" ]]; then
            exit 1
          fi
